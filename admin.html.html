<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darula | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #171717; }
        .border-subtle { border: 1px solid #e5e5e5; }
        .tab-active { border-bottom: 2px solid #171717; color: #171717; font-weight: 600; }
        #app { display: none; }
        #app.visible { display: block; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Simple Login -->
    <div id="loginArea" class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white border border-subtle p-8 rounded-lg w-full max-w-sm text-center shadow-sm">
            <h2 class="text-xl font-semibold mb-6">Interner Zugang</h2>
            <input type="password" id="pw" placeholder="Passwort" class="w-full p-2.5 bg-[#fafafa] border border-subtle rounded text-sm mb-4 outline-none text-center" onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()" class="w-full bg-[#171717] hover:bg-[#262626] text-white py-2.5 rounded text-sm font-medium transition-colors">Einloggen</button>
        </div>
    </div>

    <!-- Admin App -->
    <div id="app" class="flex-grow flex flex-col">
        <nav class="bg-white border-b border-subtle">
            <div class="max-w-7xl mx-auto px-6 flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <span class="font-semibold tracking-wide">Dispo Control</span>
                    <div class="flex gap-6 h-16">
                        <button onclick="setTab('today')" id="tab-today" class="h-full px-1 text-sm text-[#737373] hover:text-[#171717] tab-active">Tagesplan</button>
                        <button onclick="setTab('all')" id="tab-all" class="h-full px-1 text-sm text-[#737373] hover:text-[#171717]">Archiv</button>
                    </div>
                </div>
                <button onclick="logout()" class="text-xs font-medium text-[#737373] hover:text-[#171717]">Logout</button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-6 py-8 w-full">
            
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h1 class="text-2xl font-semibold mb-1" id="pageTitle">Tagesplan</h1>
                    <p class="text-sm text-[#737373]" id="pageSub">Heutige Anlieferungen im Überblick.</p>
                </div>
                <input type="text" id="search" placeholder="Suche..." onkeyup="filter()" class="p-2 bg-white border border-subtle rounded text-sm outline-none w-64">
            </div>

            <div class="bg-white border border-subtle rounded-lg overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-[#fafafa] border-b border-subtle text-[#737373]">
                        <tr>
                            <th class="px-6 py-3 font-medium">Ticket-ID</th>
                            <th class="px-6 py-3 font-medium">Datum</th>
                            <th class="px-6 py-3 font-medium">Spedition</th>
                            <th class="px-6 py-3 font-medium">Paletten</th>
                            <th class="px-6 py-3 font-medium">Beleg</th>
                            <th class="px-6 py-3 font-medium text-right">Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="tbody" class="divide-y divide-[#e5e5e5]">
                        <!-- Data injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

<script>
    const CFG = {
        P: "Sommer2026",
        U: "https://navhxyadbifllpopumfz.supabase.co",
        K: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hdmh4eWFkYmlmbGxwb3B1bWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMzYyNTIsImV4cCI6MjA4NzcxMjI1Mn0.-0uTAYMdR5rdXvlVpIdPqmMLqsv1Men1wnBfAx-Q6zY"
    };

    let sb = null;
    let rawData = [];
    let activeTab = 'today';

    function login() {
        if(document.getElementById('pw').value === CFG.P) {
            sessionStorage.setItem('auth', 'true');
            initApp();
        } else alert("Falsches Passwort");
    }

    function logout() { sessionStorage.clear(); location.reload(); }

    window.onload = () => { if(sessionStorage.getItem('auth') === 'true') initApp(); }

    async function initApp() {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('app').classList.add('visible');
        sb = supabase.createClient(CFG.U, CFG.K);
        await loadData();
    }

    async function loadData() {
        const { data } = await sb.from('avisierung').select('*').order('liefer_datum', { ascending: true });
        rawData = data || [];
        render();
    }

    function setTab(tab) {
        activeTab = tab;
        document.getElementById('tab-today').className = `h-full px-1 text-sm text-[#737373] hover:text-[#171717] ${tab==='today'?'tab-active':''}`;
        document.getElementById('tab-all').className = `h-full px-1 text-sm text-[#737373] hover:text-[#171717] ${tab==='all'?'tab-active':''}`;
        
        document.getElementById('pageTitle').innerText = tab === 'today' ? "Tagesplan" : "Gesamt-Archiv";
        document.getElementById('pageSub').innerText = tab === 'today' ? "Heutige Anlieferungen" : "Alle Datensätze";
        render();
    }

    function render() {
        const todayStr = new Date().toISOString().split('T')[0];
        let list = activeTab === 'today' ? rawData.filter(i => i.liefer_datum === todayStr) : rawData;
        
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = list.length ? '' : '<tr><td colspan="6" class="px-6 py-8 text-center text-[#737373]">Keine Daten vorhanden.</td></tr>';

        list.forEach(row => {
            const fileLink = row.lieferschein_url 
                ? `<a href="${row.lieferschein_url}" target="_blank" class="text-blue-600 hover:underline text-xs">Anzeigen</a>` 
                : `<span class="text-[#a3a3a3] text-xs">Fehlt</span>`;

            tbody.innerHTML += `
                <tr class="hover:bg-[#fafafa]">
                    <td class="px-6 py-4 font-mono text-xs text-[#525252]">${row.avis_id || '-'}</td>
                    <td class="px-6 py-4">${row.liefer_datum.split('-').reverse().join('.')}</td>
                    <td class="px-6 py-4 font-medium">${row.firma}</td>
                    <td class="px-6 py-4">${row.palettes}</td>
                    <td class="px-6 py-4">${fileLink}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="del('${row.id}')" class="text-red-500 hover:text-red-700 text-xs font-medium uppercase">Löschen</button>
                    </td>
                </tr>
            `;
        });
    }

    function filter() {
        const q = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('#tbody tr').forEach(tr => {
            tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
        });
    }

    async function del(id) {
        if(confirm("Datensatz wirklich löschen?")) {
            await sb.from('avisierung').delete().eq('id', id);
            loadData();
        }
    }
</script>
</body>
</html>
