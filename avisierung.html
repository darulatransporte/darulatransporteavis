<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL | AVISIERUNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { blue: '#209fd9', orange: '#f39200', black: '#0a0a0a' } }, fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } }
        }
    </script>
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #0a0a0a; color: #0a0a0a; }
        .border-hard { border: 2px solid #0a0a0a; }
        .btn-brutal { transition: all 0s; box-shadow: 4px 4px 0px 0px #0a0a0a; }
        .btn-brutal:hover:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0px 0px #0a0a0a; }
        .btn-brutal:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #0a0a0a; }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: #0a0a0a; border: 2px solid #0a0a0a; }
        .cal-day { background: white; padding: 10px; min-height: 100px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; font-family: 'JetBrains Mono', monospace; }
        .cal-day:hover:not(.disabled):not(.inventur) { background: #0a0a0a; color: white; }
        .cal-day.disabled { background: #e5e5e5; color: #a3a3a3; cursor: not-allowed; }
        .cal-day.selected { background: #209fd9 !important; color: white !important; }
        .cal-day.inventur { background: #f39200; color: #0a0a0a; cursor: not-allowed; }
        
        .step-container { display: none; }
        .step-container.active { display: block; }
        
        .input-brutal { border: 2px solid #0a0a0a; background: #fff; padding: 0.75rem; font-family: 'JetBrains Mono', monospace; width: 100%; border-radius: 0; outline: none; }
        .input-brutal:focus { background: #f0f8ff; border-color: #209fd9; }

        @media print { 
            body * { visibility: hidden; } 
            #receiptArea, #receiptArea * { visibility: visible; } 
            #receiptArea { position: absolute; left: 0; top: 0; width: 100%; padding: 0; border: none; } 
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col p-4 md:p-8">

    <main class="flex-grow max-w-5xl mx-auto w-full bg-white border-hard flex flex-col shadow-[8px_8px_0px_0px_rgba(255,255,255,0.2)]">
        
        <!-- Header -->
        <header class="border-b-2 border-brand-black p-6 flex justify-between items-center bg-gray-50">
            <div class="flex items-center gap-4">
                <a href="index.html" class="border-2 border-brand-black p-2 hover:bg-brand-black hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                </a>
                <h1 class="text-2xl font-bold uppercase tracking-tighter">Terminal // Avisierung</h1>
            </div>
            <img src="darula_logo.jpg" alt="Logo" class="h-8">
        </header>

        <div class="p-6 md:p-12">
            
            <!-- STEP 1: Kalender -->
            <div id="step1" class="step-container active">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 border-b-2 border-brand-black pb-4">
                    <div>
                        <div class="font-mono text-sm font-bold text-brand-blue mb-1">SEQ. 01</div>
                        <h2 class="text-4xl font-bold uppercase">Rampen-Slot</h2>
                    </div>
                    <div class="flex items-center gap-4 mt-4 md:mt-0 font-mono text-lg">
                        <button onclick="changeMonth(-1)" class="border-2 border-brand-black px-4 py-1 hover:bg-brand-black hover:text-white">&larr;</button>
                        <span id="monthLabel" class="font-bold w-40 text-center uppercase"></span>
                        <button onclick="changeMonth(1)" class="border-2 border-brand-black px-4 py-1 hover:bg-brand-black hover:text-white">&rarr;</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-7 gap-0 border-2 border-brand-black border-b-0 text-center font-mono text-sm font-bold bg-brand-black text-white">
                    <div class="py-2 border-r-2 border-brand-black">MO</div><div class="py-2 border-r-2 border-brand-black">DI</div><div class="py-2 border-r-2 border-brand-black">MI</div><div class="py-2 border-r-2 border-brand-black">DO</div><div class="py-2 border-r-2 border-brand-black">FR</div><div class="py-2 border-r-2 border-brand-black">SA</div><div class="py-2">SO</div>
                </div>

                <div class="cal-grid mb-8" id="calendarGrid"></div>
                
                <div class="flex justify-between items-center">
                    <div class="font-mono text-xs flex gap-4 uppercase">
                        <span><span class="inline-block w-3 h-3 bg-white border border-black mr-1"></span> Frei</span>
                        <span><span class="inline-block w-3 h-3 bg-gray-300 border border-black mr-1"></span> Voll</span>
                        <span><span class="inline-block w-3 h-3 bg-brand-orange border border-black mr-1"></span> Inventur</span>
                    </div>
                    <button onclick="goToStep2()" id="btnNext" disabled class="bg-brand-black text-white font-bold uppercase px-8 py-3 border-hard btn-brutal disabled:opacity-50 disabled:cursor-not-allowed">
                        Initiiere Dateneingabe &rarr;
                    </button>
                </div>
            </div>

            <!-- STEP 2: Formular -->
            <div id="step2" class="step-container">
                <div class="mb-8 border-b-2 border-brand-black pb-4 flex justify-between items-end">
                    <div>
                        <div class="font-mono text-sm font-bold text-brand-blue mb-1">SEQ. 02</div>
                        <h2 class="text-4xl font-bold uppercase">Frachtdaten</h2>
                    </div>
                    <div class="font-mono text-sm font-bold bg-brand-black text-white px-4 py-2">
                        ZIEL-DATUM: <span id="lblSelectedDate"></span>
                    </div>
                </div>
                
                <form id="avisForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block font-mono text-sm font-bold uppercase mb-2">Spedition // Frachtführer *</label>
                            <input type="text" id="fCompany" required class="input-brutal">
                        </div>
                        <div>
                            <label class="block font-mono text-sm font-bold uppercase mb-2">Kontakt E-Mail *</label>
                            <input type="email" id="fEmail" required class="input-brutal">
                        </div>
                        <div>
                            <label class="block font-mono text-sm font-bold uppercase mb-2">Paletten-Anzahl *</label>
                            <input type="number" id="fPalettes" min="1" required class="input-brutal">
                        </div>
                        <div>
                            <label class="block font-mono text-sm font-bold uppercase mb-2">BE-Referenznummer *</label>
                            <input type="text" id="fBe" required class="input-brutal">
                        </div>
                        <div class="md:col-span-2 border-2 border-brand-black p-4 bg-gray-50">
                            <label class="block font-mono text-sm font-bold uppercase mb-2">Lieferschein (PDF/IMG)</label>
                            <input type="file" id="fDoc" class="font-mono text-sm w-full file:mr-4 file:py-2 file:px-4 file:border-2 file:border-brand-black file:bg-white file:text-brand-black file:font-bold hover:file:bg-brand-black hover:file:text-white transition-colors cursor-pointer">
                        </div>
                    </div>

                    <div class="flex justify-between pt-8">
                        <button type="button" onclick="goToStep1()" class="border-2 border-brand-black bg-white font-bold uppercase px-8 py-3 hover:bg-gray-100 transition-colors">&larr; Abbruch</button>
                        <button type="submit" id="submitBtn" class="bg-brand-blue text-white font-bold uppercase px-8 py-3 border-hard btn-brutal">Datensatz Schreiben</button>
                    </div>
                </form>
            </div>

            <!-- STEP 3: Beleg -->
            <div id="step3" class="step-container">
                <div class="max-w-2xl mx-auto">
                    <div id="receiptArea" class="bg-white border-4 border-brand-black p-8 relative">
                        <div class="absolute top-0 right-0 bg-brand-black text-white font-mono text-xs px-2 py-1 uppercase">Approved</div>
                        
                        <div class="border-b-4 border-brand-black pb-6 mb-6 text-center">
                            <h2 class="text-4xl font-black uppercase tracking-tighter">Manifest</h2>
                            <p class="font-mono text-sm mt-2">DARULA TRANSPORTE // RAMPEN-DISPO</p>
                        </div>
                        
                        <div class="space-y-4 font-mono text-sm">
                            <div class="flex justify-between border-b-2 border-dashed border-gray-300 pb-2">
                                <span class="font-bold">SYSTEM-ID:</span> <strong id="rId" class="text-brand-blue"></strong>
                            </div>
                            <div class="flex justify-between border-b-2 border-dashed border-gray-300 pb-2">
                                <span class="font-bold">DATUM:</span> <strong id="rDate" class="text-xl"></strong>
                            </div>
                            <div class="flex justify-between border-b-2 border-dashed border-gray-300 pb-2">
                                <span class="font-bold">SPEDITION:</span> <strong id="rCompany"></strong>
                            </div>
                            <div class="flex justify-between border-b-2 border-dashed border-gray-300 pb-2">
                                <span class="font-bold">BE-REF:</span> <strong id="rBe"></strong>
                            </div>
                            <div class="flex justify-between border-b-2 border-dashed border-gray-300 pb-2">
                                <span class="font-bold">MENGE:</span> <strong><span id="rPalettes"></span> PAL</strong>
                            </div>
                        </div>

                        <div class="mt-8 pt-4 border-t-4 border-brand-black text-center text-xs font-mono">
                            DOKUMENT IST OHNE UNTERSCHRIFT GÜLTIG.
                        </div>
                    </div>

                    <div class="mt-8 flex justify-center gap-4 font-mono text-sm no-print">
                        <button onclick="window.print()" class="bg-brand-black text-white px-6 py-3 font-bold uppercase border-hard btn-brutal">Manifest Drucken</button>
                        <button onclick="location.reload()" class="bg-white border-2 border-brand-black px-6 py-3 font-bold uppercase hover:bg-gray-100">Neuer Vorgang</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

<script>
    const CFG = {
        U: "https://navhxyadbifllpopumfz.supabase.co",
        K: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hdmh4eWFkYmlmbGxwb3B1bWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxMzYyNTIsImV4cCI6MjA4NzcxMjI1Mn0.-0uTAYMdR5rdXvlVpIdPqmMLqsv1Men1wnBfAx-Q6zY",
        MAX_LKW: 3
    };

    let sb = null;
    let currentDate = new Date();
    let selectedDate = null;
    let bookedData = {};

    window.onload = async () => {
        sb = supabase.createClient(CFG.U, CFG.K);
        await fetchAvailability();
        renderCalendar();
    };

    const generateId = () => `DRL-${new Date().toISOString().slice(2,10).replace(/-/g,'')}-${Math.random().toString(36).substr(2,4).toUpperCase()}`;

    async function fetchAvailability() {
        try {
            const { data } = await sb.from('avisierung').select('liefer_datum');
            bookedData = {};
            (data || []).forEach(row => {
                bookedData[row.liefer_datum] = (bookedData[row.liefer_datum] || 0) + 1;
            });
        } catch (e) { console.error("DB Error", e); }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        
        const y = currentDate.getFullYear();
        const m = currentDate.getMonth();
        
        document.getElementById('monthLabel').innerText = new Intl.DateTimeFormat('de-DE', {month:'long', year:'numeric'}).format(currentDate);

        const firstDay = (new Date(y, m, 1).getDay() + 6) % 7;
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const todayStr = new Date().toISOString().split('T')[0];

        for(let i=0; i<firstDay; i++) grid.innerHTML += `<div class="cal-day disabled bg-black"></div>`;

        for(let d=1; d<=daysInMonth; d++) {
            const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const count = bookedData[dStr] || 0;
            const isWeekend = [0, 6].includes(new Date(y, m, d).getDay());
            const isInventur = (dStr === '2026-11-11');
            const isPast = dStr < todayStr || isWeekend;
            const isFull = count >= CFG.MAX_LKW;

            const div = document.createElement('div');
            
            if(isInventur) {
                div.className = 'cal-day inventur';
                div.innerHTML = `<span class="text-xl font-bold">${d}</span><span class="text-[10px] uppercase font-bold border-t border-black pt-1">Sperre</span>`;
            } else if(isPast) {
                div.className = 'cal-day disabled';
                div.innerHTML = `<span class="text-xl">${d}</span>`;
            } else if(isFull) {
                div.className = 'cal-day disabled';
                div.innerHTML = `<span class="text-xl">${d}</span><span class="text-[10px] uppercase font-bold border-t border-gray-400 pt-1">MAX CAP</span>`;
            } else {
                div.className = `cal-day ${selectedDate === dStr ? 'selected' : ''}`;
                div.innerHTML = `
                    <span class="text-xl font-bold">${d}</span>
                    <span class="text-[10px] uppercase font-bold border-t border-current pt-1">CAP: ${count}/${CFG.MAX_LKW}</span>
                `;
                div.onclick = () => {
                    selectedDate = dStr;
                    document.getElementById('btnNext').disabled = false;
                    renderCalendar();
                };
            }
            grid.appendChild(div);
        }
    }

    function changeMonth(dir) {
        currentDate.setMonth(currentDate.getMonth() + dir);
        renderCalendar();
    }

    function goToStep2() {
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        document.getElementById('lblSelectedDate').innerText = selectedDate.split('-').reverse().join('.');
    }
    
    function goToStep1() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
    }

    document.getElementById('avisForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = "UPLOADING...";

        const file = document.getElementById('fDoc').files[0];
        let fileUrl = null;

        try {
            if(file) {
                const fPath = `${Date.now()}_${file.name}`;
                await sb.storage.from('lieferscheine').upload(fPath, file);
                const { data } = sb.storage.from('lieferscheine').getPublicUrl(fPath);
                fileUrl = data.publicUrl;
            }

            const payload = {
                avis_id: generateId(),
                liefer_datum: selectedDate,
                firma: document.getElementById('fCompany').value,
                email: document.getElementById('fEmail').value,
                palettes: parseInt(document.getElementById('fPalettes').value),
                be_nummer: document.getElementById('fBe').value,
                lieferschein_url: fileUrl,
                status: 'gebucht'
            };

            const { error } = await sb.from('avisierung').insert([payload]);
            if(error) throw error;

            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
            
            document.getElementById('rId').innerText = payload.avis_id;
            document.getElementById('rDate').innerText = payload.liefer_datum.split('-').reverse().join('.');
            document.getElementById('rCompany').innerText = payload.firma;
            document.getElementById('rBe').innerText = payload.be_nummer;
            document.getElementById('rPalettes').innerText = payload.palettes;

        } catch (error) {
            alert("SYS.ERR: " + (error.message || "Unbekannt"));
            btn.disabled = false; btn.innerText = "Datensatz Schreiben";
        }
    });
</script>
</body>
</html>
